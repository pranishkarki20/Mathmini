services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartflow
      POSTGRES_USER: smartflow
      POSTGRES_PASSWORD: smartflow-local
    ports:
      - "5432:5432"
    volumes:
      - smartflow-postgres:/var/lib/postgresql/data

volumes:
  smartflow-postgres:
